[theme]
base = "dark"
primaryColor = "#4D9FFF"
backgroundColor = "#050912"
secondaryBackgroundColor = "#0E1A2E"
textColor = "#E8F1FF"

[client]
toolbarMode = "minimal"

[server]
# Uploads are only honeypot CSVs; cap them so the public site can't be flooded
maxUploadSize = 20
enableXsrfProtection = true
# Check files for changes by polling, and rerun the app automatically when they change
fileWatcherType = "poll"
runOnSave = true

[browser]
# Don't send any usage statistics from visitors' browsers
gatherUsageStats = false
